<header class="h-16 bg-white/90 backdrop-blur border-b border-stone-200/70 px-6 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <span class="badge-status badge-primary">{{ request.user.get_role_display }}</span>
        <h2 class="text-sm font-semibold text-stone-800">{{ request.user.get_full_name|default:request.user.username }}</h2>
    </div>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="inline-flex items-center gap-1.5 rounded-xl border border-stone-200 bg-white px-3.5 py-1.5 text-xs font-semibold text-stone-700 shadow-sm hover:border-[#773344] hover:text-[#773344] transition-all">
            <span>Cerrar sesión</span>
        </button>
    </form>
</header>
