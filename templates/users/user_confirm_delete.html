{% extends "base.html" %}

{% block title %}Eliminar usuario — Administración — Dulce Arte{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl space-y-6">
    <div>
        <p class="text-xs font-semibold uppercase tracking-wider text-[#773344]">Administración</p>
        <h2 class="mt-1 font-serif text-3xl font-bold text-stone-900">Eliminar usuario</h2>
    </div>
    <section class="rounded-2xl border border-rose-200 bg-white p-6 shadow-sm">
        <p class="text-sm text-stone-700">¿Confirmas que quieres eliminar la cuenta <strong>{{ object.username }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post" class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
            {% csrf_token %}
            <a href="{% url 'dashboard:administration' %}" class="inline-flex justify-center rounded-xl border border-stone-300 bg-white px-4 py-2.5 text-sm font-semibold text-stone-700 hover:bg-stone-50">Cancelar</a>
            <button type="submit" class="inline-flex justify-center rounded-xl bg-rose-700 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-rose-800">Eliminar usuario</button>
        </form>
    </section>
</div>
{% endblock %}
